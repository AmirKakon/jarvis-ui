# Paste into a Lovelace dashboard (Manual card → vertical stack / entities).
# Sensors are created by jarvis-home/scripts/bus-monitor.mjs on the mini-pc.

type: vertical-stack
cards:
  - type: entities
    title: Line 616 (home ↔ work)
    entities:
      - entity: sensor.bus_616_eta
        name: Minutes
      - entity: sensor.bus_616_status
        name: Status
      - entity: sensor.bus_616_leg
        name: Active leg
  - type: entities
    title: Line 65 (home ↔ train)
    entities:
      - entity: sensor.bus_65_eta
        name: Minutes
      - entity: sensor.bus_65_status
        name: Status
      - entity: sensor.bus_65_leg
        name: Active leg
