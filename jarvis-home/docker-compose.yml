services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "20008:20008"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jerusalem
      - WEBUI_PORT=20008
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://localhost:20008/ | grep -q '[23][0-9][0-9]\\|403'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ${HOME}/jarvis/qbittorrent-config:/config
      - ${HOME}/shared-storage-2/downloads:/downloads
      - ${HOME}/shared-storage-2/movies:/media/movies
      - ${HOME}/shared-storage-2/tv-shows:/media/tv-shows
      - ${HOME}/jarvis/scripts:/scripts:ro
      - ${HOME}/jarvis/qbittorrent-init:/custom-cont-init.d:ro

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    environment:
      - TZ=Asia/Jerusalem
    # LAN + localhost only. HA VM uses 192.168.68.124:20011; host scripts use loopback.
    ports:
      - "127.0.0.1:20011:1984"
      - "192.168.68.124:20011:1984"
    devices:
      - /dev/video0:/dev/video0
    group_add:
      - "44"
    volumes:
      - ${HOME}/jarvis/go2rtc.yaml:/config/go2rtc.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1984/api >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
