# nginx reverse-proxy for the JARVIS Alexa skill endpoint.
#
# Alexa custom skills invoke an HTTPS endpoint from Amazon's cloud, so the bot's
# local /alexa route (127.0.0.1:20010) must be reachable at a public, TLS-secured
# URL. This exposes ONLY /alexa publicly — /ask and the /v1 shim stay off the
# internet (they're bearer-token protected and meant for LAN/HA use).
#
# Prereqs on the mini-pc (kamuri-mini-pc):
#   - DuckDNS domain pointed at your home IP (e.g. kakischer.duckdns.org) and a
#     DuckDNS updater running (cron) so the record tracks your dynamic IP.
#   - Router port-forward: external TCP 443 -> mini-pc:443.
#   - A Let's Encrypt cert for the domain (certbot). Amazon REQUIRES a certificate
#     from an Amazon-trusted CA (Let's Encrypt qualifies) — a self-signed cert is
#     NOT accepted for a skill's HTTPS endpoint.
#
# Get/renew the cert (HTTP-01; needs :80 forwarded during issuance) e.g.:
#   sudo certbot certonly --standalone -d kakischer.duckdns.org
# or use the certbot-dns-duckdns plugin for a DNS-01 challenge (no :80 needed).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kakischer.duckdns.org;   # <-- your DuckDNS domain

    ssl_certificate     /etc/letsencrypt/live/kakischer.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kakischer.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;   # Alexa requires TLS 1.2+

    # Expose ONLY the Alexa endpoint publicly.
    location = /alexa {
        proxy_pass http://127.0.0.1:20010/alexa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Alexa signature headers must reach the app untouched:
        proxy_set_header SignatureCertChainUrl $http_signaturecertchainurl;
        proxy_set_header Signature $http_signature;
        proxy_read_timeout 15s;
    }

    # Everything else on this vhost is closed.
    location / {
        return 404;
    }
}
