# nginx reverse-proxy for the JARVIS Alexa skill endpoint.
#
# Alexa custom skills invoke an HTTPS endpoint from Amazon's cloud, so the bot's
# local /alexa route (127.0.0.1:20010) must be reachable at a public, TLS-secured
# URL. This vhost exposes ONLY /alexa — everything else 404s. It reuses the
# existing Let's Encrypt cert for the DuckDNS domain.
#
# PORT NOTE: Amazon officially requires the skill endpoint on port 443. Some
# setups report success appending a custom port to the endpoint URL (undocumented).
# This host already forwards the whole 20000+ range to the mini-pc, so we serve
# Alexa on a DEDICATED port (20443) and set the skill endpoint to
#   https://kakischer.duckdns.org:20443/alexa
# If Amazon refuses the custom port, switch this to `listen 443 ssl;` and forward
# external 443 -> here instead (or use a tunnel).
#
# Deploy:
#   sudo cp jarvis-home/alexa/nginx-jarvis-alexa.conf /etc/nginx/sites-available/jarvis-alexa.conf
#   sudo ln -s /etc/nginx/sites-available/jarvis-alexa.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 20443 ssl;
    listen [::]:20443 ssl;
    server_name kakischer.duckdns.org;   # <-- your DuckDNS domain

    ssl_certificate     /etc/letsencrypt/live/kakischer.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kakischer.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;   # Alexa requires TLS 1.2+

    # Expose ONLY the Alexa endpoint. Signature/cert headers pass through by
    # default (no underscores), so no special proxy_set_header is needed for them.
    location = /alexa {
        proxy_pass http://127.0.0.1:20010/alexa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    # Everything else on this vhost is closed.
    location / {
        return 404;
    }
}
